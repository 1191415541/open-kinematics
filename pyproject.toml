[tool.uv.workspace]
members = [
    "packages/suspension_contracts",
    "packages/suspension_kinematics",
    "packages/suspension_multibody",
]

[tool.codespell]
skip = ".git,*.pyc,*.pyo,__pycache__,*.egg-info,.venv,venv,.mypy_cache,.ruff_cache"
ignore-words-list = "nd"
builtin = "clear,rare,informal,usage"
dictionary = ".codespell-british.txt,-"

[tool.ty.src]
# GUI and visualization code relies on dynamically typed third-party APIs.
# Keep the workspace gate focused on solver, contract, and adapter code until
# those modules receive dedicated type annotations.
exclude = [
    "packages/suspension_contracts/tests/",
    "packages/suspension_kinematics/tests/",
    "packages/suspension_multibody/tests/",
    "packages/suspension_kinematics/tools/",
    "packages/suspension_kinematics/scripts/",
    "packages/suspension_kinematics/src/suspension_kinematics/generated/",
    "packages/suspension_kinematics/src/suspension_kinematics/core/vector_utils/visualization.py",
    "packages/suspension_kinematics/src/suspension_kinematics/gui/",
    "packages/suspension_kinematics/src/suspension_kinematics/visualization/",
    "packages/suspension_kinematics/src/suspension_kinematics/steering/comparison.py",
]
