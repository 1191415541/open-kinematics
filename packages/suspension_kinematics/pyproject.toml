[project]
name = "suspension-kinematics"
version = "0.4.0"
description = "Suspension geometry design and optimization solver."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cma>=4.0.0",
    "numpy>=2.2.0",
    "pyarrow>=21.0.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "scipy>=1.14.1",
    "suspension-contracts>=0.1.0,<0.2.0",
    "tksheet>=7.6.0",
    "typer>=0.19.2",
]

[tool.uv.sources]
suspension-contracts = { workspace = true }

[project.scripts]
suspension-kinematics = "suspension_kinematics.cli:app"

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "python-docx>=1.1.2"]

[dependency-groups]
dev = [
    "codespell>=2.3.0",
    "pytest>=8.3.4",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.3",
    "sympy>=1.13",
    "ty>=0.0.1a21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suspension_kinematics"]

[tool.pytest.ini_options]
addopts = "-m 'not manual' --import-mode=importlib"
markers = ["manual: marks tests as manual (deselected by default)"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["src/suspension_kinematics/generated"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D"]
ignore = [
    "D100",
    "D102",
    "D104",
    "D105",
    "D107",
    "D200",
    "D203",
    "D205",
    "D212",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D103"]
"tools/*.py" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
source = ["suspension_kinematics"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ty.src]
exclude = [
    "src/suspension_kinematics/generated/",
    "src/suspension_kinematics/visualization/",
    "src/suspension_kinematics/core/vector_utils/visualization.py",
    "tools/",
    "scripts/",
    "tests/",
]
