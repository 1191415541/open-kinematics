[project]
name = "suspension-kernel"
version = "0.1.0"
description = "Generic multibody kernel: shared C++ core and its ctypes binding."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2.0",
]

[project.scripts]
suspension-kernel-build = "suspension_kernel.binding.build:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.13.3",
    "ty>=0.0.1a21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suspension_kernel"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D"]
ignore = [
    "D100", "D101", "D102", "D104", "D105", "D107", "D200", "D203", "D205", "D212", "E501",
]

[tool.ruff.lint.per-file-ignores]
# Matches the sibling packages: test functions are named after the behaviour they
# check, so a docstring would only restate the name.
"tests/**/*.py" = ["D103"]

[tool.ty.src]
exclude = ["tests/"]
