[project]
name = "suspension-multibody"
version = "0.1.0"
description = "Quasi-static suspension K&C and load solver."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numba>=0.67.0",
    "numpy>=2.2.0",
    "pyarrow>=21.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0.2",
    "scipy>=1.14.1",
    "setuptools>=84.0.0",
    "suspension-contracts>=0.1.0,<0.2.0",
    "typer>=0.19.2",
]

[tool.uv.sources]
suspension-contracts = { workspace = true }

[project.scripts]
suspension-multibody = "suspension_multibody.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.3",
    "ty>=0.0.1a21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suspension_multibody"]

[tool.pytest.ini_options]
addopts = "-m 'not manual' --import-mode=importlib"
markers = [
    "manual: requires interactive software",
    "adams: requires local Adams/Car installation",
    "performance: benchmark gate",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D"]
ignore = [
    "D100", "D101", "D102", "D104", "D105", "D107", "D200", "D203", "D205", "D212", "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D103"]

[tool.ty.src]
exclude = ["tests/"]
